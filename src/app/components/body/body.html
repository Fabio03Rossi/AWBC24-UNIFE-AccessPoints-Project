<div class="container-sm p-5">
  <div class="container-sm pb-5 d-flex justify-content-center">
    <form class="p-4 w-75 border border-2 shadow bg-body" style="border-radius: 25px">
      <div class="input-group">
        <select class="form-select" id="inputGroupSelect01">
          <option value="id" selected>ID</option>
          <option value="edificio" selected>Edificio</option>
          <option value="modello" selected>Modello</option>
          <option value="marca" selected>Marca</option>
          <option value="tecnologia" selected>Tecnologia</option>
        </select>
        <input type="text" class="form-control" [(ngModel)]="valoreRicerca" [ngModelOptions]="{standalone: true}">
        <button class="btn btn-outline-secondary" type="button" (click)="aggiornaListaAP()">Cerca</button>
      </div>
    </form>
  </div>
  <div class="h-25">
    <div class="table-responsive" style="height: 60vh; overflow-y: auto;">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Edificio</th>
            <th scope="col">Modello</th>
            <th scope="col">Marca</th>
            <th scope="col">Tecnologia</th>
          </tr>
        </thead>
        <tbody>
        @if (apItems().length > 0) {
          @for (ap of apItems(); track $index){
            <tr>
              <td>{{ ap.id }}</td>
              <td>{{ ap.edificio }}</td>
              <td>{{ ap.modello }}</td>
              <td>{{ ap.marca }}</td>
              <td>{{ ap.tecnologia }}</td>
            </tr>
          }
        } @else {
          <tr>
            <td colspan="5">Non è presente alcun AccessPoint che corrisponde alla ricerca.</td>
          </tr>
        }
        </tbody>
      </table>
    </div>
  </div>
</div>
